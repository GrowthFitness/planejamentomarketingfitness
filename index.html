  .video-wrap {
    position: relative;
    width: min(92vw, 420px, calc(58dvh * 4 / 5));
    aspect-ratio: 4 / 5;
    flex: 0 1 auto;
    border-radius: 14px;
    overflow: hidden;
    background: #0d0d0d;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 12px 40px rgba(0,0,0,0.6);

    inset: 0;
    width: 100%;
    height: 100%;

    display: block;
  }

  .cta-button {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: min(88vw, 380px);
    padding: 15px 22px;
    background: var(--green);
    color: #ffffff;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: clamp(0.95rem, 4.2vw, 1.05rem);
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .cta-button:active {
    transform: scale(0.97);
    background: var(--green-dark);
    box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
  }

  .cta-button svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }
